<!doctype html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service Portal</title>
<meta name="description" content="Bilingual (Bengali + English) service portal — government, citizen, private services, schemes, news and helplines.">
<link rel="icon" href="/static/img/seed/logo.svg" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css?v=8">
</head>
<body>
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
<div class="grain" aria-hidden="true"></div>

<header class="topbar glass" id="topbar">
  <a class="brand" href="#/" aria-label="Home">
    <img id="brandLogo" class="brand-logo" src="/static/img/seed/logo.svg" alt="">
    <span class="brand-text"><b id="brandName"></b><small id="brandTagline"></small></span>
  </a>
  <nav class="nav" id="nav"></nav>
  <div class="top-actions">
    <button class="icon-btn" id="langBtn" title="Language"><span id="langLabel">EN</span></button>
    <button class="icon-btn" id="themeBtn" title="Theme">◐</button>
    <div id="authArea" class="auth-area"></div>
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
  </div>
</header>

<div class="ticker glass" id="ticker">
  <span class="ticker-badge" data-i18n="important"></span>
  <div class="ticker-track"><div class="ticker-move" id="tickerText"></div></div>
  <div class="live-chip" id="liveChip"><span id="liveDate"></span><b id="liveTime"></b></div>
</div>

<main id="app" class="app"><div class="loading" data-i18n="loading"></div></main>

<footer class="footer glass" id="footer"></footer>

<a id="waFloat" class="wa-float" target="_blank" rel="noopener" aria-label="WhatsApp">
  <svg viewBox="0 0 32 32" width="28" height="28" fill="currentColor"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.7c-2 0-4-.6-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.7 10.7 0 1 1 16 26.7zm5.9-8c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.8 8.8 0 0 1-4.4-3.8c-.3-.6.3-.5 1-1.7.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.4c.2.2 2.4 3.6 5.7 5 2.1.9 3 1 4 .8.7-.1 1.9-.8 2.2-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.2-.6-.4z"/></svg>
</a>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-card glass" role="dialog" aria-modal="true">
    <button class="modal-close" data-close aria-label="Close">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<div class="admin-shell" id="adminShell" aria-hidden="true"></div>
<div class="toasts" id="toasts"></div>

<script src="/static/js/i18n.js?v=8"></script>
<script src="/static/js/app.js?v=8"></script>
<script src="/static/js/admin.js?v=8"></script>
</body>
</html>
