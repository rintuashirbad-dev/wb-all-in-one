# /etc/nginx/sites-available/portal  (then: ln -s ../sites-available/portal /etc/nginx/sites-enabled/)
server {
    listen 80;
    server_name example.com www.example.com;   # <-- change to your domain

    client_max_body_size 6m;                   # keep >= MAX_UPLOAD_MB

    # Static assets & uploaded images served directly by nginx
    location /static/ {
        alias /opt/portal_site/static/;
        expires 7d;
        add_header Cache-Control "public";
    }
    location /uploads/ {
        alias /opt/portal_site/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
